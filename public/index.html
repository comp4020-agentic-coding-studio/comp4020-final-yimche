<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Torchlight</title>
    <meta name="description" content="Hide and seek in a dark maze where everyone is the seeker." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="game">
    <main class="stage" aria-label="Maze">
      <canvas id="maze" tabindex="0" aria-label="The maze. Move with WASD or the arrow keys, and use a powerup with Space."></canvas>

      <!-- what a player needs mid-round, always on screen: the room and who's left -->
      <div class="hud">
        <p class="hud-line">
          <span id="hud-room" class="hud-room" aria-label="Room code">····</span>
          <button id="copy" type="button" class="hud-button">Copy link</button>
          <a class="hud-button" href="/">Other rooms</a>
        </p>
        <p id="hud-count" class="hud-count">No opponents yet</p>
      </div>

      <!-- the round's state, and under it each catch as it happens, fading after a few seconds -->
      <div class="top">
        <div id="banner" class="banner" role="status" aria-live="polite"></div>
        <ol id="notices" class="notices" aria-live="polite"></ol>
      </div>
      <div id="lobby" class="lobby" hidden>
        <div id="modes" class="modes" role="radiogroup" aria-label="Game mode">
          <button type="button" data-mode="ffa" role="radio">Free for all</button>
          <button type="button" data-mode="teams" role="radio">Teams</button>
          <button type="button" data-mode="duel" role="radio">One v one</button>
        </div>
        <button id="start" class="start" type="button">Start the round</button>
      </div>
      <button id="slot" class="slot" type="button" data-kind="" hidden>
        <span class="icon" aria-hidden="true">
          <svg data-kind="speed" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>
          <svg data-kind="xray" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg data-kind="teleport" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
          <svg data-kind="freeze" viewBox="0 0 24 24"><path d="M12 2v20 M3.34 7 20.66 17 M3.34 17 20.66 7 M10.2 6.6 12 4.8 13.8 6.6 M15.7 7.7 18.2 8.4 17.6 10.9 M17.6 13.1 18.2 15.6 15.7 16.3 M13.8 17.4 12 19.2 10.2 17.4 M8.3 16.3 5.8 15.6 6.4 13.1 M6.4 10.9 5.8 8.4 8.3 7.7"/></svg>
        </span>
        <span id="slot-label">Empty</span>
        <kbd>Space</kbd>
      </button>
    </main>

    <dialog id="join">
      <form method="dialog" id="join-form">
        <h2>Who's in the maze?</h2>
        <label for="name">Your name</label>
        <input id="name" name="name" maxlength="16" required autocomplete="nickname" />
        <p id="join-error" class="error" role="alert"></p>
        <button type="submit">Play as a guest</button>
        <button id="to-account" type="button" class="quiet">Sign in or make an account</button>
      </form>
    </dialog>

    <dialog id="account">
      <form method="dialog" id="account-form">
        <h2>Your account</h2>
        <label for="username">Username</label>
        <input id="username" name="username" maxlength="16" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" required autocomplete="current-password" />
        <p id="account-error" class="error" role="alert"></p>
        <button type="submit" value="login">Sign in</button>
        <button id="signup" type="button" class="quiet">Make a new account</button>
        <button id="account-back" type="button" class="quiet">Back</button>
      </form>
    </dialog>

    <dialog id="rooms">
      <form method="dialog" id="rooms-form">
        <h2>Pick a room</h2>
        <ul id="room-list" class="room-list"></ul>
        <button id="new-room" type="button">Make a new room</button>
        <label for="code">Or type a friend's code</label>
        <input id="code" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" />
        <p id="rooms-error" class="error" role="alert"></p>
        <button type="submit" class="quiet">Join</button>
      </form>
    </dialog>
  </body>
</html>
